<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Startline</title>
  <link rel="stylesheet" href="/stil.css">
</head>
<body>
  <header>
    <strong>STARTLINE</strong>
    <span id="konto" hidden><span id="konto-email"></span> <button id="abmelden" type="button">Abmelden</button></span>
  </header>

  <main>
    <p id="laden">Lädt …</p>

    <!-- Ansicht 1: Anmelden oder registrieren -->
    <section id="ansicht-anmelden" hidden>
      <h1>Du willst loslegen, weißt aber nicht womit? Fang hier an.</h1>
      <p>25 Fragen. Drei Wege. Ein Plan, der zu dir passt.</p>
      <form id="formular-konto">
        <label for="email">E-Mail</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="passwort">Passwort (mindestens 8 Zeichen)</label>
        <input id="passwort" type="password" autocomplete="current-password" minlength="8" required>
        <p id="konto-fehler" class="fehler" role="alert" hidden></p>
        <div class="reihe">
          <button id="knopf-registrieren" type="submit" value="registrieren">Konto anlegen</button>
          <button id="knopf-anmelden" type="submit" value="anmelden" class="zweit">Anmelden</button>
        </div>
      </form>
    </section>

    <!-- Ansicht 2: Die 25 Fragen, eine nach der anderen -->
    <section id="ansicht-fragen" hidden>
      <p id="fragen-stand"></p>
      <progress id="fragen-balken" max="25" value="0"></progress>
      <p id="fragen-block" class="klein"></p>
      <h1 id="frage-text"></h1>
      <div id="frage-antworten" class="antworten"></div>
      <p id="fragen-fehler" class="fehler" role="alert" hidden></p>
      <div class="reihe">
        <button id="knopf-zurueck" type="button" class="zweit">Zurück</button>
        <button id="knopf-weiter" type="button">Weiter</button>
      </div>
    </section>

    <!-- Ansicht 3: Die drei Vorschläge -->
    <section id="ansicht-ergebnis" hidden>
      <h1>Deine drei Wege</h1>
      <p id="ergebnis-hinweis"></p>
      <div id="ergebnis-liste"></div>
      <p id="ergebnis-fehler" class="fehler" role="alert" hidden></p>
      <button id="knopf-nochmal" type="button" class="zweit">Antworten ändern</button>
    </section>

    <!-- Ansicht 4: Vertiefungsfragen zum gewählten Weg -->
    <section id="ansicht-vertiefung" hidden>
      <p class="klein">Dein Weg</p>
      <h1 id="vertiefung-weg"></h1>
      <p id="vertiefung-ehrlich"></p>
      <p>Noch sechs Fragen, damit der Plan zu dir passt.</p>
      <form id="formular-vertiefung">
        <div id="vertiefung-fragen"></div>
        <p id="vertiefung-fehler" class="fehler" role="alert" hidden></p>
        <div class="reihe">
          <button type="submit">Plan erstellen</button>
          <button id="knopf-anderer-weg" type="button" class="zweit">Anderen Weg wählen</button>
        </div>
      </form>
    </section>

    <!-- Ansicht 5: Der persönliche Plan -->
    <section id="ansicht-plan" hidden>
      <p class="klein">Dein Plan</p>
      <h1 id="plan-weg"></h1>
      <p id="plan-umfang"></p>
      <div id="plan-angepasst"></div>
      <div id="plan-liste"></div>
      <button id="knopf-plan-neu" type="button" class="zweit">Anderen Weg wählen</button>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
